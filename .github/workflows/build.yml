name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Build M1 Share.exe
        run: python -m PyInstaller "M1 Share.spec" --noconfirm

      - name: Verify the exe starts
        shell: pwsh
        run: |
          # windowed exe with --serve-only must answer HTTP requests
          $p = Start-Process -FilePath "dist\M1 Share.exe" -ArgumentList '--serve-only','--port','8380' -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-RestMethod -Uri 'http://127.0.0.1:8380/api/bootstrap' -TimeoutSec 3
              if ($r.app -eq 'M1 Share') { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $p.Id -Force -Confirm:$false -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error 'M1 Share.exe did not serve /api/bootstrap'; exit 1 }

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: M1-Share-exe-${{ github.run_number }}
          path: dist/M1 Share.exe
          retention-days: 30

  # Submit the artifact to SignPath for signing, once the project is approved.
